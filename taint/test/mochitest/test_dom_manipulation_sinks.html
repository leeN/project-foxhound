<!DOCTYPE HTML>
<html>
  <head>
    <meta charset="utf-8">
    <title>
      Check that DOM manipulation taint sinks (ChildNode/ParentNode insertion,
      the style attribute, form.action and window.open) report a flow whose sink
      node is the expected one and whose flow retains the original source.
    </title>
    <script src="/tests/SimpleTest/SimpleTest.js"></script>
    <link rel="stylesheet" href="/tests/SimpleTest/test.css"/>
    <script>
      // Run `doSink` and resolve with the detail of the `__taintreport`
      // CustomEvent the sink fires synchronously.
      function captureSinkReport(doSink) {
        return new Promise((resolve, reject) => {
          const onReport = (e) => {
            window.removeEventListener("__taintreport", onReport, true);
            resolve(e.detail);
          };
          window.addEventListener("__taintreport", onReport, true);
          try {
            doSink();
          } catch (ex) {
            window.removeEventListener("__taintreport", onReport, true);
            reject(ex);
          }
        });
      }

      // A tainted value flowing into `sink` must produce a report whose sink is
      // `sink` and whose flow still contains the original 'TestSource'.
      async function checkSinkFlow(sink, doSink) {
        const detail = await captureSinkReport(doSink);
        SimpleTest.is(detail.sink, sink, `Report sink must be '${sink}'`);
        check_tainted(detail.str);
        const ops = detail.str.taint[0].flow.map((o) => o.operation);
        SimpleTest.ok(
          detail.str.taint[0].flow.some(
            (o) => o.source && o.operation === "TestSource"
          ),
          `[${sink}] flow must retain the source 'TestSource' (flow: ${ops})`
        );
      }

      add_task(async function test_element_before() {
        const ref = document.createElement("div");
        document.body.appendChild(ref);
        await checkSinkFlow("element.before", () =>
          ref.before(String.tainted("before-text", "TestSource"))
        );
      });

      add_task(async function test_element_after() {
        const ref = document.createElement("div");
        document.body.appendChild(ref);
        await checkSinkFlow("element.after", () =>
          ref.after(String.tainted("after-text", "TestSource"))
        );
      });

      add_task(async function test_element_prepend() {
        const parent = document.createElement("div");
        document.body.appendChild(parent);
        await checkSinkFlow("element.prepend", () =>
          parent.prepend(String.tainted("prepend-text", "TestSource"))
        );
      });

      add_task(async function test_element_append() {
        const parent = document.createElement("div");
        document.body.appendChild(parent);
        await checkSinkFlow("element.append", () =>
          parent.append(String.tainted("append-text", "TestSource"))
        );
      });

      add_task(async function test_element_style() {
        const el = document.createElement("div");
        document.body.appendChild(el);
        await checkSinkFlow("element.style", () =>
          el.setAttribute("style", String.tainted("color: red;", "TestSource"))
        );
      });

      add_task(async function test_form_action() {
        const form = document.createElement("form");
        document.body.appendChild(form);
        await checkSinkFlow("form.action", () => {
          form.action = String.tainted("https://example.com/submit", "TestSource");
        });
      });

      add_task(async function test_window_open() {
        await SpecialPowers.pushPrefEnv({
          set: [["dom.disable_open_during_load", false]],
        });
        let opened;
        await checkSinkFlow("window.open", () => {
          opened = window.open(
            String.tainted("https://example.com/popup", "TestSource"),
            "_blank"
          );
        });
        if (opened) {
          opened.close();
        }
      });

      // An untainted insertion must not fire a taint report at all.
      add_task(async function test_untainted_insertion_no_report() {
        let reported = false;
        const onReport = () => {
          reported = true;
        };
        window.addEventListener("__taintreport", onReport, true);
        const parent = document.createElement("div");
        document.body.appendChild(parent);
        parent.append("clean-text");
        parent.setAttribute("style", "color: blue;");
        // Give any (unexpected) synchronous report a chance to fire.
        await Promise.resolve();
        window.removeEventListener("__taintreport", onReport, true);
        SimpleTest.ok(!reported, "untainted DOM manipulation must not report a taint flow");
      });
    </script>
  </head>
  <body>
    <p id="display"></p>
    <div id="content" style="display: none"></div>
    <pre id="test"></pre>
  </body>
</html>
